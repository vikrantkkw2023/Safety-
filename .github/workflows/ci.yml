name: Safety CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm install

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Validate native prebuild
        run: npx expo prebuild --no-install --non-interactive

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
