name: Safety Android Test APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "App.tsx"
      - "src/**"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project
        run: |
          npx expo config --type public
          npx expo-doctor

      - name: Build Android APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest init --force --non-interactive
          npx eas-cli@latest build             --platform android             --profile preview             --non-interactive             --wait             --json > eas-build.json

      - name: Download built APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="$(node -e 'const fs=require("fs"); const raw=fs.readFileSync("eas-build.json","utf8"); const data=JSON.parse(raw); const build=Array.isArray(data) ? data[0] : data; if(!build?.id) process.exit(2); process.stdout.write(build.id)')"
          npx eas-cli@latest build:download             --build-id "$BUILD_ID"             --non-interactive
          APK="$(find . -maxdepth 2 -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" Safety-test.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: safety-test-apk
          path: Safety-test.apk
          if-no-files-found: error
          retention-days: 14
