name: Safety Android Test APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "App.tsx"
      - "src/**"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "tests/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project
        run: |
          npx expo config --type public
          npx expo-doctor

      - name: Generate Android native project
        run: npx expo prebuild --clean --no-install --non-interactive --platform android

      - name: Build self-contained Android release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" ../Safety-test.apk

      - name: Verify self-contained APK
        shell: bash
        run: |
          set -euo pipefail
          test -s Safety-test.apk
          unzip -l Safety-test.apk | grep -q "index.android.bundle"
          ls -lh Safety-test.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: safety-test-apk
          path: Safety-test.apk
          if-no-files-found: error
          retention-days: 14
