name: Safety Notification Receipt Worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check-receipts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Expo notification receipts
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          RECEIPT_WORKER_SECRET: ${{ secrets.RECEIPT_WORKER_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SUPABASE_PROJECT_ID"
          test -n "$RECEIPT_WORKER_SECRET"

          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out "%{http_code}" \
            --request POST \
            --header "x-safety-worker-secret: $RECEIPT_WORKER_SECRET" \
            --header "content-type: application/json" \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/check-notification-receipts")"

          cat "$response"

          case "$status" in
            2??) ;;
            *) echo "Receipt worker failed with HTTP $status"; exit 1 ;;
          esac
